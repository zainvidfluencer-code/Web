<!doctype html><html lang="en"><head>
  <script>(()=>{if(location.protocol==='file:')return;const routes={'/campaigns.html':'/campaigns/','/creator-portal.html':'/creator-portal/','/privacy-policy.html':'/privacy-policy/','/terms-of-service.html':'/terms-of-service/','/vf-admin-gate-k8m2q.html':'/admin-login/','/vf-admin-desk-k8m2q.html':'/admin/'};const route=routes[location.pathname.toLowerCase()];if(route)location.replace(route+location.search+location.hash)})();</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f7f8fc"><title>Sign in | Vidfluencer</title>
<style>:root{--page:#f7f8fc;--paper:#fff;--ink:#11182d;--muted:#657089;--blue:#4055d6;--line:#e2e5ef;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);min-height:100vh}.top{height:76px;width:min(1080px,calc(100% - 36px));margin:auto;display:flex;align-items:center;justify-content:space-between}.top img{width:48px;height:44px;object-fit:contain}.top a{color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}.picker{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px}.card{width:min(440px,calc(100% - 28px));margin:70px auto;padding:34px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 24px 70px #1c275b12}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#e9ecff;color:var(--blue);font-size:22px;font-weight:900}.card h1{font-size:30px;letter-spacing:-.05em;margin:20px 0 8px}.card p{color:var(--muted);font-size:13px;line-height:1.6}.field{display:grid;gap:7px;margin:17px 0}.field label{font-weight:700;font-size:12px}.field input{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}.primary{width:100%;height:48px;border:0;border-radius:11px;background:var(--blue);color:white;font:inherit;font-weight:750;cursor:pointer;margin-top:10px}.status{min-height:20px;color:#a8323c;font-size:12px;line-height:1.5}.secret{padding:12px;border:1px dashed var(--line);border-radius:10px;word-break:break-all;color:#37415a;font-size:12px}.qr{display:block;max-width:190px;max-height:190px;margin:12px auto}@media(max-width:520px){.card{margin:35px auto;padding:25px}.top{height:66px}}
/* Compact flag selector with a matching, accessible language menu */
.lang-switcher{position:relative;display:inline-flex;align-items:center;z-index:70}
.lang-native-select{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;opacity:0!important}
.lang-switcher .lang-trigger{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:104px;min-height:42px;padding:0 13px;border:1px solid #e2e5ef;border-radius:999px;background:#fff;color:#11182d;font:inherit;font-size:13px;font-weight:750;cursor:pointer;box-shadow:0 2px 6px rgb(17 24 45 / .03);transition:border-color .16s,box-shadow .16s,background .16s}
.lang-switcher .lang-trigger:hover{border-color:#cbd1e4;background:#fcfcff;box-shadow:0 4px 14px rgb(17 24 45 / .08)}
.lang-flag{display:block;width:24px;height:16px;flex:none;border-radius:2px;box-shadow:0 0 0 .45px #e2e5ed}
.lang-code{letter-spacing:.025em}
.lang-chevron{width:7px;height:7px;margin:-4px 1px 0 4px;border-right:1.7px solid #737d91;border-bottom:1.7px solid #737d91;transform:rotate(45deg);transition:transform .16s}
.lang-trigger[aria-expanded="true"] .lang-chevron{margin-top:4px;transform:rotate(225deg)}
.lang-menu{position:absolute;top:calc(100% + 9px);right:0;width:250px;padding:8px;border:1px solid #e8eaf2;border-radius:20px;background:#fff;box-shadow:0 14px 36px rgb(21 29 55 / .14);z-index:90}
.lang-switcher .lang-option{display:grid;grid-template-columns:32px 1fr 20px;align-items:center;gap:8px;width:100%;min-height:52px;padding:0 10px;border:0;border-radius:13px;background:transparent;color:#20283b;text-align:left;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.lang-switcher .lang-option:hover,.lang-switcher .lang-option:focus-visible{background:#f6f7fb;outline:none}
.lang-switcher .lang-option[aria-selected="true"]{background:#f7f8fc}
.lang-option .lang-flag{width:24px;height:16px}
.lang-check{color:#4055d6;font-size:18px;font-weight:800;text-align:center;opacity:0}
.lang-option[aria-selected="true"] .lang-check{opacity:1}
.lang-switcher [hidden]{display:none!important}
@media(max-width:520px){.lang-switcher .lang-trigger{min-width:92px;min-height:40px;padding:0 10px;gap:7px}.lang-menu{width:238px}}

/* Use the transparent Vidfluencer mark in the sign-in card */
.mark{width:56px;height:48px;display:flex;align-items:center;justify-content:flex-start;border-radius:0;background:transparent;color:inherit;font-size:0}
.mark img{display:block;width:56px;height:48px;object-fit:contain;object-position:left center}</style></head><body>
<header class="top"><a href="index.html" aria-label="Vidfluencer home"><img src="assets/vidfluencer-mark.png" alt=""></a><label>◎ <select class="picker" data-language-picker aria-label="Change language"><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option></select></label></header>
<main class="card"><div class="mark"><img src="assets/vidfluencer-mark.png" alt="Vidfluencer"></div><h1 id="title">Sign in</h1><p id="copy">Use your administrator account and authenticator app.</p><form id="form"><div id="fields"></div><p class="status" id="status" role="status" aria-live="polite"></p><button class="primary" id="submit" type="submit">Continue</button></form></main>
<script src="assets/translations-de.js"></script><script src="assets/translations-es.js"></script><script src="assets/language-switcher.js"></script><script src="supabase-config.js"></script>
<script type="module">
const config=window.VIDFLUENCER_CONFIG||{},t=x=>window.VidfluencerLanguage?.t(x)||x,fields=document.querySelector('#fields'),status=document.querySelector('#status'),form=document.querySelector('#form'),title=document.querySelector('#title'),copy=document.querySelector('#copy'),submit=document.querySelector('#submit');
let client,stage='login',factorId='',enroll=false,failures=0,lockedUntil=0;
function say(s,err=true){status.textContent=t(s);status.style.color=err?'#a8323c':'#27744b'}
function input(id,label,type='text',autocomplete='off'){const wrap=document.createElement('div');wrap.className='field';const l=document.createElement('label');l.htmlFor=id;l.textContent=t(label);const i=document.createElement('input');i.id=id;i.type=type;i.autocomplete=autocomplete;i.required=true;if(type==='text'&&label.includes('code')){i.inputMode='numeric';i.maxLength=6}wrap.append(l,i);fields.append(wrap)}
function setStage(next){stage=next;fields.replaceChildren();status.textContent='';if(next==='login'){title.textContent=t('Sign in');copy.textContent=t('Use your administrator account and authenticator app.');input('email','Email address','email','username');input('password','Password','password','current-password');submit.textContent=t('Continue')}
 if(next==='totp'){title.textContent=t(enroll?'Set up authenticator':'Two-factor verification');copy.textContent=t(enroll?'Scan the QR code or enter the setup key in your authenticator app, then enter its six-digit code.':'Enter the six-digit code from your authenticator app.');if(enroll){const img=document.createElement('img');img.className='qr';img.id='qr';fields.append(img);const label=document.createElement('div');label.textContent=t('Setup key');label.className='field';const secret=document.createElement('div');secret.className='secret';secret.id='secret';label.append(secret);fields.append(label)}input('code','Authenticator code','text','one-time-code');submit.textContent=t('Verify and continue')}
}
function clientStorage(){return window.sessionStorage}
async function goDashboard(){location.replace(new URL((config.adminPaths?.dashboard)||'admin/',document.baseURI).href)}
function genericNotFound(){document.querySelector('.card').innerHTML='<div class="mark"><img src="assets/vidfluencer-mark.png" alt="Vidfluencer"></div><h1>Not found</h1><p>This page is unavailable.</p><a href="index.html">Return to Vidfluencer</a>'}
async function ensureAdmin(){const enrolled=await client.rpc('admin_enrollment_required');if(enrolled.error||enrolled.data!==true){await client.auth.signOut();genericNotFound();return false}return true}
async function beginMfa(){const ok=await ensureAdmin();if(!ok)return;const {data,error}=await client.auth.mfa.listFactors();if(error)throw error;const verified=(data.totp||[]).find(f=>f.status==='verified');if(verified){factorId=verified.id;enroll=false;setStage('totp');return}const unverified=(data.totp||[]).find(f=>f.status!=='verified');if(unverified){const removed=await client.auth.mfa.unenroll({factorId:unverified.id});if(removed.error)throw removed.error}
const created=await client.auth.mfa.enroll({factorType:'totp',friendlyName:'Vidfluencer Admin'});if(created.error)throw created.error;factorId=created.data.id;enroll=true;setStage('totp');document.querySelector('#qr').src=created.data.totp.qr_code;document.querySelector('#secret').textContent=created.data.totp.secret}
async function boot(){const m=await import(config.supabaseJsUrl||'https://esm.sh/@supabase/supabase-js@2.118.0');client=m.createClient(config.supabaseUrl,config.publishableKey,{auth:{storage:clientStorage(),persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const session=await client.auth.getSession();if(session.data.session){const aal=await client.auth.mfa.getAuthenticatorAssuranceLevel();if(!aal.error&&aal.data.currentLevel==='aal2'){const ok=await ensureAdmin();if(ok)goDashboard();return}await beginMfa()}}
setStage('login');
form.addEventListener('submit',async e=>{e.preventDefault();if(Date.now()<lockedUntil)return say('Please wait before trying again.');submit.disabled=true;try{
if(stage==='login'){const r=await client.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});if(r.error)throw r.error;failures=0;await beginMfa()}
else{const code=document.querySelector('#code').value.trim();if(!/^\d{6}$/.test(code))return say('Enter the six-digit code from your authenticator app.');const challenge=await client.auth.mfa.challenge({factorId});if(challenge.error)throw challenge.error;const verified=await client.auth.mfa.verify({factorId,challengeId:challenge.data.id,code});if(verified.error)throw verified.error;const assurance=await client.auth.mfa.getAuthenticatorAssuranceLevel();if(assurance.error||assurance.data.currentLevel!=='aal2')throw new Error('Verification required');const ok=await ensureAdmin();if(ok)goDashboard()}
}catch(err){failures++;if(failures>=5){lockedUntil=Date.now()+60000;failures=0}say(stage==='login'?'Those details didn’t work.':(enroll?'That code did not verify. Check your authenticator and try again.':'That code did not verify. Try again.'))}finally{submit.disabled=false}});
try{await boot()}catch(e){say('Sign-in is not available right now. Please try again later.')}
</script></body></html>
